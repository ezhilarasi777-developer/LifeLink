<!DOCTYPE html>
<html>
<head>
    <title>Emergency Blood Request</title>
    <link rel="stylesheet" href="style.css">

<script type="module" src="emergency.js"></script>
</head>
<body>

<h2>Emergency Blood Request</h2>

<form id="bloodRequestForm">
    <input type="text" id="patientName" placeholder="Patient Name" required><br><br>

    <select id="bloodGroup" required>
        <option value="">Select Blood Group</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>AB+</option>
        <option>AB-</option>
        <option>O+</option>
        <option>O-</option>
    </select><br><br>

    <input type="text" id="hospital" placeholder="Hospital Name" required><br><br>

    <input type="text" id="location" placeholder="Location" required><br><br>

    <button type="submit">Send Emergency Request</button>
</form>

<script type="module" src="emergency.js"></script>

</body>
</html>
