<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as donor-LifeLink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h2>❤️LifeLink</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="search.html">Search</a></li>
            <li><a href="admin.html">Admin</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <section class="register">
        <h1>🩸Become a Blood Donor </h1>
        <p>Fill in your details to help save lives.</p>
        <form  onsubmit="registerDonor(event)"><label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required><label>Age</label>
    <input type="number" id="age" placeholder="Enter your age" required>
<label >Blood Group</label>
<select id="bloodGroup" required><option value="">--Select Blood Group--</option>
<option >A+</option>
<option >A-</option>
<option >B+</option>
<option >B-</option>
<option >AB+</option>
<option >AB-</option>
<option >O+</option>
<option >O-</option>
</select>
<label>Availability</label>
<select id="availability">
    <option value="Available">🟢 Available</option>
    <option value="Not Available">🔴 Not Available</option>
</select>
<label >Mobile Number</label>
<input type="tel" id="phone" placeholder="Enter mobile number" required>
<label >Location</label>
<input type="text" id="location" placeholder="Enter your city" required>
<label >Last Blood Donate Date</label>
<input type="date" id="donationDate">
<label >Availability</label><br>
<input type="radio" name="Availability">Available
<input type="radio" name="Availability">Not Available <br><br>
<label >Address</label>
<textarea id="address" rows="4" placeholder="Enter your address"></textarea><br><br>
<button type="submit">❤️Register</button>
<button type="reset">🔄Reset</button><br><br>
<a href="index.html"><button type="button">🏠 Back to Home</button></a>
</form>
    </section>
    <script type="module" src="script.js"></script>
</body>
</html>
